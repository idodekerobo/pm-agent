[project]
name = "app"
version = "0.1.0"
description = "Add your description here"
authors = [
    { name = "idode kerobo", email = "idode.kerobo@gmail.com" }
]
requires-python = ">=3.11"
dependencies = [
    "authlib>=1.6.8",
    "cryptography>=46.0.5",
    "fastapi>=0.129.0",
    "httpx>=0.28.1",
    "itsdangerous>=2.2.0",
    "modal>=1.3.3",
    "openai-agents>=0.9.0",
    "pydantic-settings>=2.12.0",
    "pyjwt[crypto]>=2.11.0",
    "supabase>=2.28.0",
    "uvicorn>=0.40.0",
]

[project.scripts]
app = "app.main:app"

[build-system]
requires = ["uv_build>=0.9.28,<0.10.0"]
build-backend = "uv_build"
