[project]
name = "draft-bridge"
version = "0.1.0"
description = "Local bridge daemon for Draft — connects the web app to your local Claude Code"
authors = [
    { name = "idode kerobo", email = "idode.kerobo@gmail.com" }
]
requires-python = ">=3.11"
dependencies = [
    "click>=8.1.0",
    "httpx>=0.27.0",
    "keyring>=25.0.0",
    "keyrings.alt>=5.0.0",
    "starlette>=0.41.0",
    "uvicorn>=0.32.0",
    "websockets>=13.0",
]

[project.scripts]
draft-bridge = "draft_bridge.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
